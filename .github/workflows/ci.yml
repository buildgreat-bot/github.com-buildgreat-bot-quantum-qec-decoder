name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy -- -D warnings

      - name: Security audit
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions-rust-lang/audit@96e0e19d7510f3de04a5b56213388ac8fcede6d0 # v1.2.3
        with:
          createIssues: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check for uncompleted owner TODO markers on main branch
        if: github.ref == 'refs/heads/main'
        run: python scripts/check_no_todo.py

      - name: Run native Rust unit tests
        timeout-minutes: 5
        run: cargo test --no-default-features --verbose

      - name: Install build tools and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-timeout numpy stim matplotlib ldpc pandas

      - name: Build wheel with Maturin
        run: maturin build --release

      - name: Install qldpc-rs wheel
        run: pip install --no-index --find-links target/wheels qldpc_rs

      - name: Run Python unit and decoding correctness tests
        run: pytest tests/ -v --timeout-method=thread

      - name: Run ldpc cross-check
        run: python tests/cross_check_ldpc.py

      - name: Run automated claim verification suite
        run: python verify_claims.py

      - name: Run benchmark plots smoke test
        run: python benchmark_plots.py --no-save
